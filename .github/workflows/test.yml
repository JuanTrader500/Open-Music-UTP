name: Tests

on:
  push:
    branches: ["main", "Develop"]
  pull_request:
    branches: ["main", "Develop"]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/openmusic_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/openmusic_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openmusic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openmusic_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Formato (ruff format)
        run: ruff format --check backend

      - name: Lint (ruff check)
        run: ruff check backend

      - name: Pruebas con cobertura
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Verificar migraciones
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
