$kind: http-request
url: "{{base_url}}/api/health/ready"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("status ready", () => pm.expect(pm.response.json().status).to.eql("ready"));
    language: text/javascript
order: 2000
