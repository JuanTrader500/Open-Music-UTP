$kind: http-request
url: "{{base_url}}/api/playlists/{{playlist_id}}"
method: PATCH
headers:
  Authorization: Bearer {{access_token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Playlist renombrada"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("nombre actualizado", () => pm.expect(body.name).to.eql("Playlist renombrada"));
    language: text/javascript
order: 3570
