$kind: http-request
url: "{{base_url}}/api/playlists/{{playlist_id}}"
method: DELETE
headers:
  Authorization: Bearer {{access_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("409", () => pm.response.to.have.status(409));
      pm.test("pide confirmación", () => {
        pm.expect(pm.response.json().code).to.eql("CONFIRMATION_REQUIRED");
      });
    language: text/javascript
order: 3600
