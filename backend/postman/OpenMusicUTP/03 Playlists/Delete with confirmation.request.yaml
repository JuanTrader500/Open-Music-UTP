$kind: http-request
url: "{{base_url}}/api/playlists/{{playlist_id}}?confirm=true"
method: DELETE
headers:
  Authorization: Bearer {{access_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("204", () => pm.response.to.have.status(204));
      pm.collectionVariables.set("playlist_id", "");
      pm.collectionVariables.set("playlist_track_id", "");
      pm.collectionVariables.set("playlist_track_ids", "[]");
    language: text/javascript
order: 3610
