$kind: http-request
url: "{{base_url}}/api/playlists"
method: POST
headers:
  Authorization: Bearer {{access_token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Playlist de {{run_email}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test("201", () => pm.response.to.have.status(201));
      pm.test("nombre recortado", () => pm.expect(body.name).to.eql(body.name.trim()));
      pm.test("vacía", () => {
        pm.expect(body.tracks).to.eql([]);
        pm.expect(body.total).to.eql(0);
      });
      pm.collectionVariables.set("playlist_id", body.id);
    language: text/javascript
order: 3510
