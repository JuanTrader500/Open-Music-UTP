$kind: http-request
url: "{{base_url}}/api/auth/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("401", () => pm.response.to.have.status(401));
      pm.test("UNAUTHORIZED", () => pm.expect(pm.response.json().code).to.eql("UNAUTHORIZED"));
    language: text/javascript
order: 5000
