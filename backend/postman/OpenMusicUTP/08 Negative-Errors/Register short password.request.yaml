$kind: http-request
url: "{{base_url}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "short+{{$timestamp}}@utp.edu.co",
      "password": "corta",
      "accept_privacy": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("422", () => pm.response.to.have.status(422));
      pm.test("VALIDATION_ERROR", () => pm.expect(pm.response.json().code).to.eql("VALIDATION_ERROR"));
    language: text/javascript
order: 3000
