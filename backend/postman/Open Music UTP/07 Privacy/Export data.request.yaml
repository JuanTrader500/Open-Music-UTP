$kind: http-request
url: "{{base_url}}/api/auth/export"
method: GET
headers:
  Authorization: Bearer {{access_token}}
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("usuario exportado", () => pm.expect(body.user).to.have.property("id"));
    language: text/javascript
order: 1000
