# =============================================================================
# Open Music UTP · docker-compose.yml
# Servicios: PostgreSQL 16 (db), FastAPI (backend), Vue + nginx (frontend)
# y pgAdmin 4 (pgadmin).
# Uso:  docker compose up -d --build
# Requiere un archivo .env junto a este archivo (ver .env.example)
# =============================================================================
name: open-music-utp

# Rotación de logs: evita que los registros de los contenedores crezcan sin límite
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Base de datos
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: open-music-db
    restart: unless-stopped
    stop_grace_period: 30s              # tiempo para un apagado limpio de PostgreSQL
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en el archivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    ports:
      - "127.0.0.1:5433:5432"           # solo accesible desde tu equipo
    volumes:
      # Datos de PostgreSQL: sobreviven a stop, down y recreación del contenedor.
      # El esquema lo aplica el backend con Alembic al arrancar.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: durante la inicialización PostgreSQL solo escucha
      # por socket, así que el contenedor no se marca "healthy" hasta terminar.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - open-music-net
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # API FastAPI
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    container_name: open-music-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # La URL de .env apunta a localhost:5433 (uso local); dentro de la red
      # de Docker el host es `db` y el puerto interno es 5432.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Define POSTGRES_USER en el archivo .env}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}@db:5432/${POSTGRES_DB:?Define POSTGRES_DB en el archivo .env}
      MUSIC_PROVIDER: ${MUSIC_PROVIDER:-simulated}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
      CORS_ORIGINS: http://localhost:8956,http://127.0.0.1:8956
      SEED_CATALOG: ${SEED_CATALOG:-false}
    ports:
      - "127.0.0.1:7845:8000"           # http://localhost:7845/api/docs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - open-music-net
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Frontend Vue compilado + nginx
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
    container_name: open-music-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8956:80"             # http://localhost:8956
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - open-music-net
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Administrador web de la base de datos
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_TAG:-latest}
    container_name: open-music-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Define PGADMIN_DEFAULT_EMAIL en el archivo .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Define PGADMIN_DEFAULT_PASSWORD en el archivo .env}
    ports:
      - "127.0.0.1:8081:80"             # http://localhost:8081
    volumes:
      # Sesiones, servidores guardados, preferencias y configuración de pgAdmin
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy      # arranca cuando la base ya está lista
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - open-music-net
    logging: *default-logging

# -----------------------------------------------------------------------------
# Volúmenes con nombre fijo: no dependen del nombre de la carpeta del proyecto.
# No borrar con `docker compose down -v` si hay datos que conservar.
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    name: open-music-postgres-data
  pgadmin_data:
    name: open-music-pgadmin-data

networks:
  open-music-net:
    driver: bridge
